name: Maintenance observation
on:
  workflow_dispatch:
  schedule:
    - cron: '30 7 * * 1'
permissions:
  contents: read
concurrency:
  group: maintenance-observe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Observe without mutation
        run: |
          mkdir -p automation-reports
          python3 automation-templates/proactive.py docs --dry-run > automation-reports/docs.json
          python3 automation-templates/proactive.py agents --dry-run > automation-reports/agents.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maintenance-observation
          path: automation-reports/
          retention-days: 14
